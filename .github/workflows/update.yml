name: 更新股價資料

on:
  # GitHub 排程常延遲好幾小時、偶爾整次跳過，所以多排幾次，並避開整點（整點最擠）。
  # 時間是 UTC，台灣時間 = +8：14:47、15:43、16:37、18:13、19:37、21:23，隔天 07:07 再補一次
  schedule:
    - cron: "47 6 * * 1-5"
    - cron: "43 7 * * 1-5"
    - cron: "37 8 * * 1-5"
    - cron: "13 10 * * 1-5"
    - cron: "37 11 * * 1-5"
    - cron: "23 13 * * 1-5"
    - cron: "7 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# 同一時間只跑一個，避免兩次更新互相覆蓋
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 抓資料
        run: python scripts/update.py
      - name: 存檔
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data.json
          git add -A otc
          git diff --cached --quiet && exit 0
          git commit -m "更新股價 $(TZ=Asia/Taipei date +%F)"
          # 執行期間如果有人推了新的修改，先接上再推，避免推送失敗
          git pull --rebase
          git push
