name: 更新股價資料

on:
  schedule:
    - cron: "30 7 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# 同一時間只跑一個，避免兩次更新互相覆蓋
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 抓資料
        run: python scripts/update.py
      - name: 存檔
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "更新股價 $(TZ=Asia/Taipei date +%F)"
          # 執行期間如果有人推了新的修改，先接上再推，避免推送失敗
          git pull --rebase
          git push
