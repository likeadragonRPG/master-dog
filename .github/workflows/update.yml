name: 更新股價資料

on:
  schedule:
    - cron: "30 7 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓資料
        run: python scripts/update.py
      - name: 存檔
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "更新股價 $(date +%F)"
          git push
